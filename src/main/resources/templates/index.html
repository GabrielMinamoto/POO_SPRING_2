<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora</h1>
    <form th:action="@{/calcular}" method="get">
        <label>Número 1:
            <input type="number" name="a" th:value="${a}">
        </label>
        <label>Número 2:
            <input type="number" name="b" th:value="${b}">
        </label>
        <select name="operação">
            <option value="somar">Somar</option>
            <option value="subtrair">Subtração</option>
            <option value="dividir">Dividir</option>
            <option value="multiplicar">Multiplicar</option>
        </select>
        <button type="submit">Calcular</button>
    </form>

</body>
</html>
